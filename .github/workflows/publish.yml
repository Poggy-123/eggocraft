name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build both clients
        run: ./build.sh

      # Cloudflare Pages deploys this branch as-is, with no build step of its
      # own. force_orphan keeps a single commit on it, so tens of megabytes of
      # game files don't pile up in history.
      - name: Publish to the site branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: site
          publish_dir: build/site
          force_orphan: true
